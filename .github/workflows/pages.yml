name: Publish AI digest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: each run publishes a
# complete site, so an interrupted deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: Check for leaked mailbox addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI screens for two things: a real Gmail address anywhere in the repo, and
      # a mailbox URL anywhere in the published site -- Gmail (mail.google.com)
      # and Outlook Web (outlook.office365.com, /owa/?ItemID). The Outlook
      # patterns were added 2026-09-20 after 192 OWA permalinks, left over from
      # the pre-Gmail era, were found live on all eleven topic pages. Both
      # patterns are hardcoded here because they are generic -- they don't name
      # any particular mailbox.
      #
      # What CI does NOT catch: a bare mailbox local-part with no @gmail.com or
      # mail.google.com attached (e.g. a name alone). Screening for that requires
      # the actual local-parts, which live only in the gitignored
      # digest-routine/sources.json and must never enter a tracked file or this
      # workflow -- so that check runs locally only, in STEP 5.3, immediately
      # before every push. There is no CI backstop for that failure mode; STEP 5.3
      # is the sole line of defence for it.
      - name: No Gmail address or mailbox URL anywhere in the repo
        run: |
          # Published site: full strictness. Nothing under site/ may contain a
          # mailbox URL or a Gmail address -- both patterns, scoped to only
          # what actually gets deployed.
          set +e
          grep -rInE 'mail\.google\.com|outlook\.office365\.com|outlook\.live\.com|/owa/\?ItemID|[A-Za-z0-9._%+-]+@gmail\.com' \
               --exclude-dir=.git --exclude=pages.yml site/
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Found a Gmail address or mailbox URL in site/ -- refusing to publish."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::site/ Gmail/mailbox URL scan failed (grep exit $rc) -- refusing to publish unscreened."
            exit 1
          fi

          # Whole repo: real addresses only. An actual Gmail address is a leak
          # wherever it appears, but the bare mail.google.com domain is not --
          # this repo's own routine docs legitimately name it as the pattern
          # the guard exists to catch, and scanning the whole tree for it
          # would fail the build on its own documentation.
          set +e
          grep -rInE '[A-Za-z0-9._%+-]+@gmail\.com' \
               --exclude-dir=.git --exclude=pages.yml .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Found a Gmail address -- refusing to publish."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::Gmail address scan failed (grep exit $rc) -- refusing to publish unscreened."
            exit 1
          fi

          echo "Clean: no Gmail addresses anywhere, no mailbox URLs in site/."

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Pages source is set to "GitHub Actions" on the repo (confirmed live
      # 2026-09-14); enablement: true only re-enables Pages if it is ever turned
      # off. The build_type cannot be set from here -- the workflow token is
      # refused for PUT /repos/{repo}/pages, it is an admin-only setting.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site root is site/, not the repo root: digest-routine/ and docs/
      # are the routine and its design notes, and are not part of the published site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # Serve the files as-is: no Jekyll processing, no _-prefixed path stripping.
          touch _site/.nojekyll
          echo "Publishing $(find _site -name '*.html' | wc -l) HTML pages."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
