name: Publish AI digest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-digest/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: each run publishes a
# complete site, so an interrupted deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: Check for leaked mailbox links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digest is built from a private Gmail inbox. Nothing that identifies
      # that mailbox may reach a public page, so fail the deploy rather than
      # publish it. Mirrors the STEP 5.3 gate in digest-routine/.
      - name: No Gmail addresses or mailbox URLs in the site
        run: |
          if grep -rInE 'mail\.google\.com|[A-Za-z0-9._%+-]+@gmail\.com' ai-digest/; then
            echo "::error::Found a Gmail address or mailbox URL in ai-digest/ — refusing to publish."
            exit 1
          fi
          echo "Clean: no Gmail addresses or mailbox URLs in ai-digest/."

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Force the Pages source to "GitHub Actions".
      #
      # enablement: true below only *enables* Pages; if Pages was already on in
      # legacy "deploy from a branch" mode it leaves build_type alone. That mode
      # publishes the repo root, which has no index.html, and its builder runs
      # after this workflow and overwrites the deployment — the site 404s and the
      # real pages end up at /ai-digest/ai-digest/. Setting build_type=workflow
      # makes this workflow authoritative and stops the branch builder.
      - name: Set Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}') || true
          echo "PUT /pages -> HTTP $code"; cat /tmp/pages.json 2>/dev/null || true
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Could not set the Pages source automatically. Set it by hand: Settings -> Pages -> Build and deployment -> Source: GitHub Actions."
          fi

      # enablement: true turns Pages on if it is off entirely.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site root is ai-digest/, not the repo root: digest-routine/ and docs/
      # are the routine and its design notes, and are not part of the published site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R ai-digest/. _site/
          # Serve the files as-is: no Jekyll processing, no _-prefixed path stripping.
          touch _site/.nojekyll
          echo "Publishing $(find _site -name '*.html' | wc -l) HTML pages."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
