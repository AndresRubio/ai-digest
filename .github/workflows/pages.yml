name: Publish AI digest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-digest/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: each run publishes a
# complete site, so an interrupted deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: Check for leaked identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digest is built from a private Gmail inbox and this repo is public,
      # so the whole tree is screened -- not just the site. The mailbox patterns
      # live in a repository secret, never in this file: a regex naming the
      # mailboxes would publish them in the file meant to prevent exactly that.
      - name: No mailbox identifiers anywhere in the repo
        env:
          IDENTITY_PATTERNS: ${{ secrets.IDENTITY_PATTERNS }}
        run: |
          # Fail closed. A guard that no-ops when misconfigured is worse than no
          # guard, because it reports green.
          if [ -z "$IDENTITY_PATTERNS" ]; then
            echo "::error::IDENTITY_PATTERNS secret is unset. Refusing to publish unscreened."
            exit 1
          fi
          if grep -rInEi "$IDENTITY_PATTERNS" --exclude-dir=.git . ; then
            echo "::error::Found a mailbox identifier -- refusing to publish."
            exit 1
          fi
          if grep -rInE 'mail\.google\.com|[A-Za-z0-9._%+-]+@gmail\.com' \
               --exclude-dir=.git --exclude=pages.yml . ; then
            echo "::error::Found a Gmail address or mailbox URL -- refusing to publish."
            exit 1
          fi
          echo "Clean: no mailbox identifiers, Gmail addresses or mailbox URLs."

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Pages source is set to "GitHub Actions" on the repo (confirmed live
      # 2026-09-14); enablement: true only re-enables Pages if it is ever turned
      # off. The build_type cannot be set from here -- the workflow token is
      # refused for PUT /repos/{repo}/pages, it is an admin-only setting.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site root is ai-digest/, not the repo root: digest-routine/ and docs/
      # are the routine and its design notes, and are not part of the published site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R ai-digest/. _site/
          # Serve the files as-is: no Jekyll processing, no _-prefixed path stripping.
          touch _site/.nojekyll
          echo "Publishing $(find _site -name '*.html' | wc -l) HTML pages."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
